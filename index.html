<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tragaperras Controlada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ffcc00, #990000);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
    }

    .contenedor-principal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #mensaje {
      width: 300px;
      height: 95px;
      border: 3px solid gold;
      border-radius: 15px;
      background: black;
      color: white;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px gold;
      white-space: pre-line;
    }

    #botonPrueba {
      display: none;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: radial-gradient(circle, #ff00ff, #880088);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px violet;
      margin-bottom: 15px;
    }

    .maquina {
      background: linear-gradient(180deg, #8b0000, #300000);
      border: 8px solid gold;
      border-radius: 25px;
      padding: 18px 15px 22px;
      box-shadow: 0 0 25px gold;
      width: 300px;
      text-align: center;
      position: relative;
    }

    .maquina::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      border: 4px dotted yellow;
      animation: luces 1s linear infinite;
      pointer-events: none;
    }

    @keyframes luces {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    #slot-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .slot {
      width: 85px;
      height: 85px;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px black;
      border: 3px solid gold;
    }

    .slot img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      display: block;
      margin: auto;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      background: radial-gradient(circle, #00ff00, #007700);
      color: black;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px lime;
      margin-top: 10px;
    }

    button:disabled {
      background: gray;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ✅ TEXTO CASINO */
    .casino-container {
      margin-top: 80px;
      text-align: center;
      width: 100%;
    }

    .casino-line {
      width: 200px;
      height: 3px;
      background: gold;
      margin: 6px auto;
      box-shadow: 0 0 8px gold;
    }

    .casino-text {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      color: gold;
      text-shadow: 0 0 10px gold, 0 0 20px orange;
    }

    @media (max-width: 480px) {
      #mensaje {
        width: 280px;
        height: 90px;
        font-size: 17px;
      }

      .maquina {
        width: 280px;
      }

      .slot {
        width: 80px;
        height: 80px;
      }

      .slot img {
        width: 65px;
        height: 65px;
      }

      .casino-text {
        font-size: 24px;
      }

      .casino-line {
        width: 160px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor-principal">

    <div id="mensaje">🎰 Pulsa TIRAR 🎰</div>

    <button id="botonPrueba">🎯 HACER PRUEBA</button>

    <div class="maquina">

      <div id="slot-container">
        <div class="slot"><img id="img1" src="interrogacion.png"></div>
        <div class="slot"><img id="img2" src="interrogacion.png"></div>
        <div class="slot"><img id="img3" src="interrogacion.png"></div>
      </div>

      <button id="tirar">TIRAR</button>

      <audio id="sonido" src="slot.mp3"></audio>
      <audio id="ganar" src="win.mp3"></audio>
      <audio id="perder" src="lose.mp3"></audio>
      <audio id="aplausos" src="aplausos.mp3"></audio>

    </div>

    <!-- ✅ TEXTO CASINO AL FINAL -->
    <div class="casino-container">
      <div class="casino-line"></div>
      <div class="casino-text">JACKPAK</div>
      <div class="casino-line"></div>
    </div>

  </div>

  <script>
    const imagenes = ["carapaco.png", "caradamian.png", "foto2.png"];
    const pruebas = [
      "💃 Bailar una bachata",
      "🎤 Cantar una canción",
      "👩‍🏫 Su DIRECTORA elige la prueba"
    ];

    const img1 = document.getElementById("img1");
    const img2 = document.getElementById("img2");
    const img3 = document.getElementById("img3");

    const mensaje = document.getElementById("mensaje");
    const btn = document.getElementById("tirar");
    const botonPrueba = document.getElementById("botonPrueba");

    const sonido = document.getElementById("sonido");
    const ganar = document.getElementById("ganar");
    const perder = document.getElementById("perder");
    const aplausos = document.getElementById("aplausos");

    let numeroTirada = 0;

    btn.addEventListener("click", () => {
      numeroTirada++;
      botonPrueba.style.display = "none";

      mensaje.textContent = `🎲 Tirada ${numeroTirada}`;
      mensaje.style.color = "white";

      sonido.currentTime = 0;
      sonido.play();

      let pasos = 15;
      let intervalo = setInterval(() => {
        img1.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        img2.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        img3.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        pasos--;

        if (pasos === 0) {
          clearInterval(intervalo);
          sonido.pause();
          sonido.currentTime = 0;
          aplicarTiradaControlada();
        }
      }, 80);
    });

    botonPrueba.addEventListener("click", () => {
      const prueba = pruebas[Math.floor(Math.random() * pruebas.length)];
      mensaje.textContent = `🎯 PRUEBA:\n${prueba}`;
      mensaje.style.color = "yellow";
      botonPrueba.style.display = "none";
    });

    function aplicarTiradaControlada() {
      if (numeroTirada === 6) {
        ponerTresIguales("caradamian.png");
        mostrarResultado("PACO, debes superar la prueba\npara seguir jugando", "red", true);
        botonPrueba.style.display = "inline-block";
      } 
      else if (numeroTirada === 11) {
        ponerTresIguales("foto2.png");
        mostrarResultado("¡¡Regalo para todos!!\nbúscalo en el cajón de la CAJERA ", "violet", true);
      } 
      else if (numeroTirada === 15) {
        ponerTresIguales("caradamian.png");
        mostrarResultado("¡PACO, PACO, PACO!\nSupera la prueba para\n SEGUIR JUGANDO", "red", true);
        botonPrueba.style.display = "inline-block";
      } 
      else if (numeroTirada === 20) {
        ponerTresIguales("carapaco.png");
        mostrarResultado("🏆 ¡PACO, HAS GANADO! 🏆\nTIENES UN REGALO EN EL CAJON DE TU HABILITADO\n🎰 FIN DEL JUEGO 🎰 ", "lime", true);

        ganar.play();
        aplausos.play();

        btn.disabled = true;
        btn.textContent = "JUEGO FINALIZADO";
      } 
      else {
        ponerTresDiferentes();
        mostrarResultado("😅 No hay premio\nInténtalo otra vez", "orange", false);
      }
    }

    function ponerTresIguales(img) {
      img1.src = img;
      img2.src = img;
      img3.src = img;
    }

    function ponerTresDiferentes() {
      let a, b, c;
      do {
        a = imagenes[Math.floor(Math.random() * imagenes.length)];
        b = imagenes[Math.floor(Math.random() * imagenes.length)];
        c = imagenes[Math.floor(Math.random() * imagenes.length)];
      } while (a === b || b === c || a === c);

      img1.src = a;
      img2.src = b;
      img3.src = c;
    }

    function mostrarResultado(texto, color, esVictoria) {
      mensaje.textContent = texto;
      mensaje.style.color = color;

      if (numeroTirada !== 20) {
        if (esVictoria) ganar.play();
        else perder.play();
      }
    }
  </script>

</body>
</html>
