<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tragaperras Controlada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ffcc00, #990000);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor-principal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #mensaje {
      width: 360px;
      height: 110px;
      border: 3px solid gold;
      border-radius: 15px;
      background: black;
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px gold;
      white-space: pre-line;
    }

    /* ✅ BOTÓN DE PRUEBA */
    #botonPrueba {
      display: none;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: radial-gradient(circle, #ff00ff, #880088);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px violet;
      margin-bottom: 20px;
    }

    .maquina {
      background: linear-gradient(180deg, #8b0000, #300000);
      border: 8px solid gold;
      border-radius: 25px;
      padding: 25px 30px 30px;
      box-shadow: 0 0 25px gold;
      text-align: center;
      position: relative;
    }

    .maquina::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      border: 4px dotted yellow;
      animation: luces 1s linear infinite;
      pointer-events: none;
    }

    @keyframes luces {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    #slot-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .slot {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px black;
      border: 3px solid gold;
    }

    .slot img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      border: none;
      border-radius: 50px;
      background: radial-gradient(circle, #00ff00, #007700);
      color: black;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px lime;
      margin-top: 10px;
    }

    button:disabled {
      background: gray;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="contenedor-principal">

    <div id="mensaje">🎰 Pulsa TIRAR 🎰</div>

    <!-- ✅ BOTÓN DE PRUEBA -->
    <button id="botonPrueba">🎯 HACER PRUEBA</button>

    <div class="maquina">

      <div id="slot-container">
        <div class="slot"><img id="img1" src="interrogacion.png"></div>
        <div class="slot"><img id="img2" src="interrogacion.png"></div>
        <div class="slot"><img id="img3" src="interrogacion.png"></div>
      </div>

      <button id="tirar">TIRAR</button>

      <!-- 🎵 SONIDOS -->
      <audio id="sonido" src="slot.mp3"></audio>
      <audio id="ganar" src="win.mp3"></audio>
      <audio id="perder" src="lose.mp3"></audio>
      <audio id="aplausos" src="aplausos.mp3"></audio>

    </div>
  </div>

  <script>
    const imagenes = ["carapaco.png", "caradamian.png", "foto2.png"];
    const pruebas = [
      "💃 Bailar una bachata",
      "🎤 Cantar una canción",
      "👩‍🏫 Su Directora elige la prueba"
    ];

    const img1 = document.getElementById("img1");
    const img2 = document.getElementById("img2");
    const img3 = document.getElementById("img3");

    const mensaje = document.getElementById("mensaje");
    const btn = document.getElementById("tirar");
    const botonPrueba = document.getElementById("botonPrueba");

    const sonido = document.getElementById("sonido");
    const ganar = document.getElementById("ganar");
    const perder = document.getElementById("perder");
    const aplausos = document.getElementById("aplausos");

    let numeroTirada = 0;

    btn.addEventListener("click", () => {
      numeroTirada++;
      botonPrueba.style.display = "none"; // siempre se oculta al tirar

      mensaje.textContent = `🎲 Tirada ${numeroTirada}`;
      mensaje.style.color = "white";

      sonido.currentTime = 0;
      sonido.play();

      let pasos = 15;
      let intervalo = setInterval(() => {
        img1.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        img2.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        img3.src = imagenes[Math.floor(Math.random() * imagenes.length)];
        pasos--;

        if (pasos === 0) {
          clearInterval(intervalo);
          sonido.pause();
          sonido.currentTime = 0;
          aplicarTiradaControlada();
        }
      }, 80);
    });

    botonPrueba.addEventListener("click", () => {
      const prueba = pruebas[Math.floor(Math.random() * pruebas.length)];
      mensaje.textContent = `🎯 PRUEBA:\n${prueba}`;
      mensaje.style.color = "yellow";

      botonPrueba.style.display = "none"; // se vuelve a ocultar tras usarlo
    });

    function aplicarTiradaControlada() {

      if (numeroTirada === 6) {
        ponerTresIguales("caradamian.png");
        mostrarResultado("¡PACO, HAS PERDIDO!\nDEBES SUPERAR LA PRUEBA PARA SEGUIR JUGANDO", "red", true);
        botonPrueba.style.display = "inline-block"; // ✅ APARECE BOTÓN
      } 
      else if (numeroTirada === 11) {
        ponerTresIguales("foto2.png");
        mostrarResultado("TUS COMPIS RECIBEN UN REGALO\nBÚSCALO EN EL CAJON DE LA CAJERA", "violet", true);
      } 
      else if (numeroTirada === 15) {
        ponerTresIguales("caradamian.png");
        mostrarResultado("¡PACO, HAS VUELTO A PERDER!\nSUPERA LA PRUEBA", "red", true);
        botonPrueba.style.display = "inline-block"; // ✅ VUELVE A APARECER
      } 
      else if (numeroTirada === 20) {
        ponerTresIguales("carapaco.png");
        mostrarResultado("🏆 ¡PACO, HAS GANADO! 🏆\nTIENES OTRO REGALO EN EL CAJON DE TU HABILITADO\n🎰 FIN DEL JUEGO", "lime", true);

        ganar.play();
        aplausos.play();

        btn.disabled = true;
        btn.textContent = "JUEGO FINALIZADO";
      } 
      else {
        ponerTresDiferentes();
        mostrarResultado("😅 No hay premio\nInténtalo otra vez", "orange", false);
      }
    }

    function ponerTresIguales(img) {
      img1.src = img;
      img2.src = img;
      img3.src = img;
    }

    function ponerTresDiferentes() {
      let a, b, c;
      do {
        a = imagenes[Math.floor(Math.random() * imagenes.length)];
        b = imagenes[Math.floor(Math.random() * imagenes.length)];
        c = imagenes[Math.floor(Math.random() * imagenes.length)];
      } while (a === b || b === c || a === c);

      img1.src = a;
      img2.src = b;
      img3.src = c;
    }

    function mostrarResultado(texto, color, esVictoria) {
      mensaje.textContent = texto;
      mensaje.style.color = color;

      if (numeroTirada !== 20) {
        if (esVictoria) ganar.play();
        else perder.play();
      }
    }
  </script>

</body>
</html>
